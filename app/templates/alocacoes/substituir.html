{% extends "base.html" %}{% block header %}Substituir Autonomo{% endblock %}
{% block content %}
<section class="panel mb-6"><p class="font-bold">{{ fato.piloto.nome_piloto }} / {{ fato.prova.nome_prova }}</p><p class="text-zinc-500">Atual: {{ fato.autonomo.nome_autonomo }}</p></section>
<form class="panel form-grid" method="post">
  <div><label class="label">Novo autonomo</label><select class="input" name="id_autonomo_substituto" required>{% for a in autonomos %}<option value="{{ a.id_autonomo }}">{{ a.nome_autonomo }} - {{ a.tipo_autonomo }}</option>{% endfor %}</select></div>
  <div><label class="label">Data troca</label><input class="input" type="date" name="data_troca" value="{{ today }}" required></div>
  <div><label class="label">Motivo</label><select class="input" name="id_motivo_troca" required>{% for m in motivos %}<option value="{{ m.id_motivo_troca }}">{{ m.motivo_troca }}</option>{% endfor %}</select></div>
  <div class="span-3"><label class="label">Justificativa</label><textarea class="input" name="justificativa_troca" required></textarea></div>
  <div><label class="label">Valor do pacote novo</label><input class="input" name="valor_fechado_etapa"></div>
  <div class="span-3"><label class="label">Observacoes</label><textarea class="input" name="observacoes"></textarea></div>
  <div><button class="btn-primary">Confirmar substituicao</button></div>
</form>
{% endblock %}
