{% extends "base.html" %}{% block header %}Avaliar Autonomo{% endblock %}
{% block content %}<section class="panel mb-6"><p class="font-bold">{{ fato.autonomo.nome_autonomo }}</p><p>{{ fato.piloto.nome_piloto }} / {{ fato.prova.nome_prova }}</p></section><form class="panel form-grid" method="post"><div><label class="label">Nota tecnica</label><input class="input" type="number" step="0.1" min="0" max="10" name="nota_tecnica" required></div><div><label class="label">Pontualidade</label><input class="input" type="number" step="0.1" min="0" max="10" name="nota_pontualidade" required></div><div><label class="label">Comunicacao</label><input class="input" type="number" step="0.1" min="0" max="10" name="nota_comunicacao" required></div><div><label class="label">Relacionamento</label><input class="input" type="number" step="0.1" min="0" max="10" name="nota_relacionamento" required></div><div><label class="label">Nota geral manual</label><input class="input" type="number" step="0.1" min="0" max="10" name="nota_geral" placeholder="Opcional"></div><div><label class="label">Data avaliacao</label><input class="input" type="date" name="data_avaliacao" value="{{ today }}" required></div><div class="span-3"><label class="label">Comentario</label><textarea class="input" name="comentario_avaliacao"></textarea></div><div><button class="btn-primary">Salvar avaliacao</button></div></form>{% endblock %}
