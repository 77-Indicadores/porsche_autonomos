{% extends "base.html" %}{% block header %}Custo Fechado{% endblock %}
{% block content %}<section class="panel mb-6"><p class="font-bold">{{ fato.autonomo.nome_autonomo }}</p><p>{{ fato.piloto.nome_piloto }} / {{ fato.prova.nome_prova }}</p></section><form class="panel form-grid" method="post"><div><label class="label">Valor fechado etapa/prova</label><input class="input" name="valor_fechado_etapa" value="{{ fato.valor_fechado_etapa if fato.valor_fechado_etapa is not none else '' }}"></div><div><label class="label">Status pagamento</label><select class="input" name="status_pagamento"><option value="">Selecione</option>{% for p in pagamentos %}<option {% if fato.status_pagamento == p.status_pagamento %}selected{% endif %}>{{ p.status_pagamento }}</option>{% endfor %}</select></div><div><label class="label">Data pagamento</label><input class="input" type="date" name="data_pagamento" value="{{ fato.data_pagamento if fato.data_pagamento else '' }}"></div><div><label class="label">Documento/comprovante</label><input class="input" name="documento" value="{{ fato.documento or '' }}"></div><div class="span-3"><label class="label">Observacoes financeiras</label><textarea class="input" name="observacoes">{{ fato.observacoes or '' }}</textarea></div><div><button class="btn-primary">Salvar custo</button></div></form>{% endblock %}
