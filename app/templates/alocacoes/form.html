{% extends "base.html" %}{% block header %}Nova Alocacao{% endblock %}
{% block content %}<form class="panel form-grid" method="post"><div><label class="label">Piloto</label><select class="input" name="id_piloto" required>{% for p in pilotos %}<option value="{{ p.id_piloto }}">{{ p.nome_piloto }}</option>{% endfor %}</select></div><div><label class="label">Etapa</label><select class="input" name="id_etapa" required>{% for e in etapas %}<option value="{{ e.id_etapa }}">{{ e.nome_etapa }}</option>{% endfor %}</select></div><div><label class="label">Prova</label><select class="input" name="id_prova" required>{% for p in provas %}<option value="{{ p.id_prova }}">{{ p.nome_prova }}</option>{% endfor %}</select></div><div><label class="label">Funcao</label><input class="input" name="funcao_autonomo" required placeholder="Mecanico"></div><div><label class="label">Autonomo</label><select class="input" name="id_autonomo" required>{% for a in autonomos %}<option value="{{ a.id_autonomo }}">{{ a.nome_autonomo }} - {{ a.tipo_autonomo }}</option>{% endfor %}</select></div><div><label class="label">Inicio vinculo</label><input class="input" type="date" name="data_inicio_vinculo" value="{{ today }}" required></div><div><label class="label">Valor fechado</label><input class="input" name="valor_fechado_etapa" placeholder="3300,00"></div><div><label class="label">Status pagamento</label><select class="input" name="status_pagamento"><option value="">Sem valor</option>{% for p in pagamentos %}<option>{{ p.status_pagamento }}</option>{% endfor %}</select></div><div class="span-3"><label class="label">Observacoes</label><textarea class="input" name="observacoes"></textarea></div><div><button class="btn-primary">Criar alocacao</button></div></form>{% endblock %}
