{% extends "base.html" %}
{% block header %}{{ 'Editar piloto' if piloto else 'Novo piloto' }}{% endblock %}
{% block content %}
<form class="panel" method="post">
  <div class="form-grid">
    <div><label class="label">Nome</label><input class="input" name="nome" required value="{{ piloto.nome if piloto else '' }}"></div>
    <div><label class="label">Categoria</label><input class="input" name="categoria" value="{{ piloto.categoria if piloto else '' }}" placeholder="Carrera Cup"></div>
    <label class="flex items-center gap-2 font-semibold text-slate-700"><input type="checkbox" name="ativo" value="1" {% if not piloto or piloto.ativo %}checked{% endif %}> Ativo</label>
  </div>
  <div class="mt-5 flex gap-2"><button class="btn-primary">Salvar</button><a class="btn-muted" href="/pilotos">Cancelar</a></div>
</form>
{% endblock %}
