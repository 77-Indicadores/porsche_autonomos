
<div class="excel-import-box">
    <span class="excel-title">Excel - Tipos de Prova</span>

    <a href="/excel/modelo/tipos-prova">
        Baixar modelo
    </a>

    <form action="/excel/importar/tipos-prova" method="post" enctype="multipart/form-data" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0;">
        <input type="file" name="arquivo" accept=".xlsx" required>
        <button type="submit">Importar Excel</button>
    </form>
</div>

{% extends "base.html" %}{% block header %}Tipos de Prova{% endblock %}{% block content %}<section class="panel mb-6"><form method="post" class="form-grid"><div><label class="label">Nome</label><input class="input" name="nome_tipo_prova" required></div><div><label class="label">Status</label><input class="input" name="status_tipo_prova" value="Ativo"></div><div class="span-3"><label class="label">Descricao</label><textarea class="input" name="descricao"></textarea></div><div><button class="btn-primary">Salvar</button></div></form></section><section class="panel"><table class="table"><thead><tr><th>Tipo</th><th>Status</th><th>Descricao</th></tr></thead><tbody>{% for i in items %}<tr><td class="font-bold">{{ i.nome_tipo_prova }}</td><td>{{ i.status_tipo_prova }}</td><td>{{ i.descricao or '-' }}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
