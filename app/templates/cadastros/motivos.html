
<div class="excel-import-box">
    <span class="excel-title">Excel - Motivos de Troca</span>

    <a href="/excel/modelo/motivos-troca">
        Baixar modelo
    </a>

    <form action="/excel/importar/motivos-troca" method="post" enctype="multipart/form-data" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0;">
        <input type="file" name="arquivo" accept=".xlsx" required>
        <button type="submit">Importar Excel</button>
    </form>
</div>

{% extends "base.html" %}{% block header %}Motivos de Troca{% endblock %}{% block content %}<section class="panel mb-6"><form method="post" class="form-grid"><div><label class="label">Motivo</label><input class="input" name="motivo_troca" required></div><div><label class="label">Status</label><input class="input" name="status" value="Ativo"></div><div class="span-3"><label class="label">Descricao</label><textarea class="input" name="descricao"></textarea></div><div><button class="btn-primary">Salvar</button></div></form></section><section class="panel"><table class="table"><thead><tr><th>Motivo</th><th>Status</th><th>Descricao</th></tr></thead><tbody>{% for i in items %}<tr><td class="font-bold">{{ i.motivo_troca }}</td><td>{{ i.status }}</td><td>{{ i.descricao or '-' }}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
