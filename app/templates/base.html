<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porsche Cup Autonomos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-zinc-100 text-zinc-900">
  <div class="min-h-screen lg:flex">
    <aside class="bg-zinc-950 text-white lg:w-80">

<div class="sidebar-logo-porsche-img">
  <a href="https://www.porschegt3cup.com.br" target="_blank" rel="noopener">
    <img src="/static/img/porsche.png" alt="Porsche Carrera Cup Brasil">
  </a>
</div>




        {% endfor %}
      </nav>
    </aside>
    <main class="flex-1">
      <header class="bg-white border-b border-zinc-200 px-5 sm:px-8 py-5">
        <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
          <div>
            <p class="text-sm text-zinc-500">cadastro -> etapa/categoria -> alocacao -> troca -> avaliacao -> custo fechado</p>
            <h2 class="text-2xl font-bold text-zinc-950">{% block header %}Visao Geral{% endblock %}</h2>
          </div>
          {% block header_action %}{% endblock %}
        </div>
      </header>
      <section class="p-5 sm:p-8">
        {% if success %}<div class="flash flash-success">{{ success }}</div>{% endif %}
        {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
